<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 132" role="img" aria-label="Createk Consultores">
  <defs>
    <linearGradient id="ck-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c48c"/>
      <stop offset="1" stop-color="#12a79a"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: la "C" bicolor -->
  <g fill="none" stroke-linecap="round" stroke-width="18">
    <!-- cuerpo oscuro de la C (abierta a la derecha) -->
    <path d="M 90.4 27 A 46 46 0 1 0 90.4 105" stroke="#0f3a42"/>
    <!-- trazo verde-teal superior -->
    <path d="M 58 20.7 A 46 46 0 0 1 111.3 58" stroke="url(#ck-green)"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="64" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="1.5" fill="#0f3a42">CREATEK</text>
  <text x="152" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="6.5" fill="#93a3a5">CONSULTORES</text>
</svg>
